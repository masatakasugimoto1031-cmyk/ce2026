<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CE特論 ワークベンチ｜依頼主の新規事業担当として</title>
<script src="config.js"></script>
<style>
:root{--ac:#750145;--ac-d:#5d0037;--ac-m:#ac668f;--ac-l:#f4e8ef;--ac-l2:#e3ccd9;--ink:#1f2328;--sub:#59636e;--line:#d8dde3;--soft:#f6f7f9;--ok:#1f7a4d;--warn:#a15c00;--fs:16px}
html.big{--fs:18px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",sans-serif;font-size:var(--fs);color:var(--ink);line-height:1.55;background:#fff}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.brand{font-weight:800;color:var(--ac)}
.who{color:var(--sub);font-size:.88em}
.conds{display:flex;gap:4px;margin-left:auto;align-items:center}
.conds span.l{font-size:.78em;color:var(--sub);margin-right:4px}
.cd{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-size:.8em;font-weight:800;background:var(--soft);color:var(--sub);border:1px solid var(--line);cursor:default}
.cd.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.hbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.86em}
.hbtn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.wrap{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100% - 60px)}
nav.side{border-right:1px solid var(--line);background:var(--soft);padding:12px 10px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.grp{font-size:.76em;font-weight:800;color:var(--sub);margin:14px 8px 6px;letter-spacing:.02em}
.it{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer}
.it:hover{background:#fff}
.it.on{background:#fff;box-shadow:inset 3px 0 0 var(--ac);font-weight:700}
.it small{display:block;color:var(--sub);font-size:.76em;font-weight:400}
.st{font-size:.72em;border-radius:999px;padding:2px 8px;white-space:nowrap;background:#fff;border:1px solid var(--line);color:var(--sub)}
.st.done{background:var(--ac-l);border-color:var(--ac-l2);color:var(--ac-d)}
.st.sent{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:18px 28px 80px;max-width:1280px}
h1{font-size:1.5em;margin:4px 0 2px}
.meta{color:var(--sub);font-size:.88em;margin-bottom:12px}
.meta b{color:var(--ac-d)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.box.soft{background:var(--soft);border-color:transparent}
.box h3{margin:0 0 6px;font-size:1em;color:var(--ac-d)}
label.f{display:block;font-size:.84em;font-weight:700;color:var(--sub);margin:10px 0 4px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
textarea:focus,input:focus,select:focus{outline:2px solid var(--ac-l2);border-color:var(--ac-m)}
textarea{resize:vertical;min-height:2.3em}
table.t{border-collapse:collapse;width:100%;font-size:.92em}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
table.t th{background:var(--soft);font-weight:700;font-size:.9em}
table.t td.c,table.t th.c{text-align:center}
table.t textarea,table.t input[type=text]{border-color:transparent;background:transparent;padding:4px}
table.t textarea:focus,table.t input:focus{background:#fff;border-color:var(--ac-m)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:5px 10px;cursor:pointer;font-size:.9em;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ac);color:#fff;font-weight:700}
.btn{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.g{background:#fff;color:var(--ac-d);border:1px solid var(--ac)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.note{color:var(--sub);font-size:.86em}
.warn{color:var(--warn);font-weight:700}
.kpi{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.kpi div{background:var(--ac-l);color:var(--ac-d);border-radius:8px;padding:6px 12px;font-weight:700;font-size:.92em}
.cell{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:58px;padding:6px 8px;cursor:pointer;text-align:left;width:100%}
.cell.on{border-color:var(--ac);background:var(--ac-l)}
fieldset{border:0;margin:0;padding:0;min-width:0}
fieldset[disabled] textarea,fieldset[disabled] input{background:var(--soft)}
.ro{background:#fff7e6;border:1px solid #f0d9a8;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:.9em}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:9;max-width:420px}
.toast.on{opacity:.95}
.mob{max-width:560px;margin:0 auto;padding:16px}
.mob h1{font-size:1.3em}
@media (max-width:900px){.wrap{grid-template-columns:1fr}nav.side{position:static;height:auto}.grid2,.grid3{grid-template-columns:1fr}.conds{margin-left:0}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json" style="display:none">
<script>
"use strict";
const CFG=window.CE_CONFIG||{endpoint:'',version:''};
const KEY='ce2026_wb';
const COMP=['JR九州','西鉄'];
const Q7=[
 {id:'A2',f:'ひと',k:'人が集まるか',q:'社員はどこから来ているか。頼まずに応募が来るか'},
 {id:'B3',f:'技とノウハウ',k:'外で通じる名前',q:'その名前で社外から指名・問い合わせが来るか'},
 {id:'C1',f:'まわす力',k:'受け入れる余地',q:'曜日・時期で空く設備・場所・人手はあるか'},
 {id:'D1',f:'つながり',k:'一緒に動く相手',q:'困ったときに無理を聞き合える取引先はあるか'},
 {id:'E2',f:'選ばれる理由',k:'なぜ選ばれるか',q:'顧客はなぜ選ぶと言ったか（誰が・いつ）'},
 {id:'F2',f:'土地との関わり',k:'地元とのやり取り',q:'自治体・地元金融機関と定常のやり取りはあるか'},
 {id:'G1',f:'組んだ実績',k:'一緒に立ち上げた例',q:'他社・行政・大学と立ち上げ、今も動くものは'}];
const SYM=['◎','○','△','？'];
const WHO=['本人','同じ立場','関係者','対象外'];
const RX=['言った','動いた','対価を出した','続けた'];
const RXR={'言った':1,'動いた':2,'対価を出した':3,'続けた':4};
const STAR=['合っていた','外れた','まだ分からない'];
const COND=['依頼主のどの強み（外に出せる強み）を使うかを、出所と一緒に指差せる','届ける相手が名前か特定できる立場で分かっていて、いまの代わりの手段を知っている','組む相手と、相手に増えるものが、相手の側の言葉で書かれている','年末年始の聞き取りで、本人か同じ立場の人から「動いた」以上の反応を1つ以上得た（得られなければ理由）','やめる条件と★があり、聞き取りでどうなったかが書かれている','始めるための3つの問いに答えられ、最初の一歩が本業を止めず半年以内に試せる','社内で通す道：誰が決め、どの場で通し、社内の何を借り、既存事業とどうぶつかり・助け合うか（代わりの道も1行）'];
const REVROWS=['いちばん確かでない条件（★）','届ける相手・場面','渡すもの','相手が払うもの','社内の資源と既存事業との関係'];

function blankT(){return {interview:{q1:'',q2:'',who:'',where:'',res:'',conflict:'',qa:''},treas:[0,1,2,3,4].map(()=>({w:'',q:'',src:''})),troubles:['','',''],cell:null,far:'',ai:{ans:''},
 hyp:{who:'',scene:'',alt:'',altCost:'',give:'',pay:'',p1:'',p2:'',star:'',stop:''},mid:{path:'',next:''},
 rev:{rows:REVROWS.map(()=>({res:'',act:'',nw:''})),judge:'',why:''},persona:{who:'',scene:'',gain:'',pain:''},value:{give:'',gainUp:'',painDown:''},
 partners:[0,1,2].map(()=>({lack:'',from:'',stage:'',gain:'',burden:''})),both:{client:'',partner:''},approve:'',
 bmc:{name:'',kp:'',ka:'',kr:'',vp:'',cr:'',ch:'',cs:'',cost:'',rev:''},bmd:{players:[0,1,2,3,4,5].map(()=>({name:'',role:''})),flows:[0,1,2,3,4,5,6,7].map(()=>({from:'',to:'',kind:'',what:''}))},
 path:{who:'',where:'',res:'',conflict:'',fallback:''},shape:{title:'',concl:'',ask:'',first:'',three:{who:'',start:'',newv:''},cond:[null,null,null,null,null,null,null],condWhy:'',aiDiff:''},excl:{}};}
function blank(){return {ver:1,big:false,sec:'me_profile',me:{sid:'',name:''},
 pre:{company:'',purpose:'',purposeWhy:'',j:{},p16:'',ind:'',job:'',nbc:'',c1:false,c2:''},
 hw:{closed:{a:'',b:'',c:''},bmc:{name:'',kp:'',ka:'',kr:'',vp:'',cr:'',ch:'',cs:'',cost:'',rev:''},oi:{type:'',a:'',b:'',c:''},jr:{v:'',o:'',s:'',x:''},refl:{a:'',b:'',c:''}},
 sent:{},tsent:{},mine:null,T:blankT(),recs:[],teamAt:'',myRecs:[],draft:{who:'',rx:'',date:'',said:'',does:'',alt:'',star:'',note:'',fam:false}};}
let S=load();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.ver===1)return mg(blank(),x);}catch(e){}return blank();}
function mg(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))mg(a[k],b[k]);else a[k]=b[k];}return a;}
let svT;function save(){clearTimeout(svT);svT=setTimeout(flush,300);}
function flush(){clearTimeout(svT);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('この端末に保存できません。「控え」をファイルに保存してください');}}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush();});
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function get(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S);}
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=v;save();}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
function fmt(d){if(!d)return '';const x=new Date(d);return isNaN(x)?String(d):`${x.getMonth()+1}/${x.getDate()} ${String(x.getHours()).padStart(2,'0')}:${String(x.getMinutes()).padStart(2,'0')}`;}

/* ---------- 部品 ---------- */
function ta(p,label,ph,rows){return `${label?`<label class="f">${label}</label>`:''}<textarea data-p="${p}" rows="${rows||2}" placeholder="${esc(ph||'')}">${esc(get(p)||'')}</textarea>`;}
function tx(p,label,ph){return `${label?`<label class="f">${label}</label>`:''}<input type="text" data-p="${p}" value="${esc(get(p)||'')}" placeholder="${esc(ph||'')}">`;}
function seg(p,opts){const v=get(p);return `<div class="seg">${opts.map(o=>`<button data-seg="${p}" data-v="${esc(o)}" class="${v===o?'on':''}">${esc(o)}</button>`).join('')}</div>`;}

/* ---------- 通信 ---------- */
async function post(body){if(!CFG.endpoint)throw new Error('受け口がまだ設定されていません（講師に連絡）');const r=await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw new Error(j.err||'送れませんでした');return j;}
async function fetchGet(q){if(!CFG.endpoint)throw new Error('受け口がまだ設定されていません（講師に連絡）');const r=await fetch(CFG.endpoint+'?'+new URLSearchParams(q));const j=await r.json();if(!j.ok)throw new Error(j.err||'読めませんでした');return j;}
async function whoami(){if(!S.me.sid||!S.me.name){toast('はじめに学籍番号と氏名を入れてください');return;}try{const j=await fetchGet({op:'me',sid:S.me.sid,name:S.me.name});S.mine=j.me;save();render();toast(j.me?`チーム${j.me.team}（${j.me.company}）・${j.me.role}`:'まだチームに登録されていません（12/18の編成のあと）');}catch(e){toast(e.message);}}
async function pullTeam(){if(!S.mine){await whoami();if(!S.mine)return;}try{const j=await fetchGet({op:'team',team:S.mine.team,tkey:S.mine.tkey});
 if(j.team&&!isRec()){S.T=mg(blankT(),j.team.data);S.teamAt=j.team.at;}else if(j.team&&isRec()&&!S.teamAt){S.T=mg(blankT(),j.team.data);S.teamAt=j.team.at;}
 S.recs=dedupe(j.recs||[]);save();render();toast('チームの最新を読みました');}catch(e){toast(e.message);}}
function dedupe(rs){const m={};rs.forEach(r=>{m[r.rid||Math.random()]=r;});return Object.values(m);}
const TPH={q:'担当者への質問',hyp:'仮説シート（1/7）',bmc:'ビジネスモデルキャンバス（1/21）',final:'最終の提出（2/4）',save:'共有'};
async function pushTeam(ph){ph=ph||'save';if(!isRec()){toast('チームの画面への入力と提出はチームリーダーだけができます');return;}if(!S.mine){await whoami();if(!S.mine)return;}const T=S.T;const data=JSON.parse(JSON.stringify(T));data.title=T.shape.title;data.summary=T.shape.concl;
 try{const j=await post({op:'team',sid:S.me.sid,name:S.me.name,team:S.mine.team,phase:ph,data});S.teamAt=j.at;if(ph!=='save')S.tsent[ph]=j.at;save();render();toast(ph==='save'?'メンバーに共有しました':TPH[ph]+'を提出しました（メンバーにも共有されます）');}catch(e){toast(e.message);}}
function subBtn(ph,label){return isRec()?`<div class="bar"><button class="btn" data-act="tsub" data-ph="${ph}">${label}</button>${S.tsent[ph]?`<span class="note">提出済み ${fmt(S.tsent[ph])}（出し直せます。最後のものが使われます）</span>`:''}</div>`:'';}
async function uploadFile(){const f=$('pptIn').files[0];if(!f){toast('ファイルを選んでください');return;}if(f.size>20*1024*1024){toast('20MBまでです。画像を圧縮してください');return;}if(!S.mine){await whoami();if(!S.mine)return;}toast('送っています…');
 const b64=await new Promise((ok,ng)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ng;r.readAsDataURL(f);});
 try{const j=await post({op:'file',sid:S.me.sid,name:S.me.name,team:S.mine.team,fname:f.name,mime:f.type||'application/octet-stream',b64});S.tsent.file=j.at;S.tsent.fileName=f.name;save();render();toast('ファイルを提出しました');}catch(e){toast(e.message);}}
async function submitMe(kind,data){if(!S.me.sid||!S.me.name){toast('はじめに学籍番号と氏名を入れてください');go('me_profile');return;}
 try{const j=await post({op:'submit',sid:S.me.sid,name:S.me.name,kind,data});S.sent[kind]=j.at;save();render();toast('提出しました');}catch(e){toast(e.message);}}
async function sendRec(){const d=S.draft;if(!d.who||!d.rx){toast('相手の種類と反応を選んでください');return;}if(!S.mine){await whoami();if(!S.mine)return;}
 const rid=S.me.sid+'-'+Date.now();const data=Object.assign({},d,{by:S.me.name});
 try{await post({op:'rec',team:S.mine.team,tkey:S.mine.tkey,sid:S.me.sid,rid,data});S.myRecs.push({rid,at:new Date().toISOString(),data});S.draft={who:'',rx:'',date:'',said:'',does:'',alt:'',star:'',note:'',fam:false};save();render();toast('1件送りました');}catch(e){toast(e.message);}}
function isRec(){return S.mine&&S.mine.role==='チームリーダー';}

/* ---------- 判定（7つの条件のそろい具合） ---------- */
function recStats(){const rs=S.recs.filter(r=>!S.T.excl[r.rid]).map(r=>r.data||{});const real=rs.filter(d=>!d.fam&&d.who);const m={};WHO.forEach(w=>{m[w]={};RX.forEach(x=>m[w][x]=0);});real.forEach(d=>{if(m[d.who]&&m[d.who][d.rx]!=null)m[d.who][d.rx]++;});
 const strong=real.filter(d=>(d.who==='本人'||d.who==='同じ立場')&&RXR[d.rx]>=2).length;let best=null;real.forEach(d=>{if(d.rx&&(!best||RXR[d.rx]>RXR[best.rx]))best=d;});
 const st={};STAR.forEach(s=>st[s]=real.filter(d=>d.star===s).length);return {n:real.length,fam:rs.length-real.length,m,strong,best,st};}
function condAuto(){const T=S.T,H=T.hyp,P=T.path,Th=T.shape.three;const rs=recStats();return [
 T.treas.some(t=>t.w&&t.src),!!(H.who&&H.alt),T.partners.some(p=>p.from&&p.gain),rs.strong>0,!!(H.star&&H.stop&&T.rev.rows[0].res),!!(Th.who&&Th.start&&Th.newv&&T.shape.first),!!(P.who&&P.where&&P.res&&P.conflict)];}

/* ---------- 画面の一覧 ---------- */
const SEC=[
 {g:'ひとりの課題',id:'me_profile',t:'はじめに',d:'',r:secProfile,st:()=>S.me.sid&&S.me.name?'done':''},
 {g:'ひとりの課題',id:'me_pre',t:'事前課題：依頼主の7つの力',d:'12/17（木）23:59',r:secPre,st:()=>S.sent.pre?'sent':(S.pre.company?'done':'')},
 {g:'ひとりの課題',id:'me_closed',t:'クローズドイノベーションの事例',d:'12/24（木）23:59',r:()=>secHw('closed'),st:()=>S.sent.closed?'sent':''},
 {g:'ひとりの課題',id:'me_rec',t:'聞き取りを送る（1件ずつ）',d:'年末年始〜1/7',r:secRecSend,st:()=>S.myRecs.length?'done':''},
 {g:'ひとりの課題',id:'me_oi',t:'オープンイノベーションの事例',d:'1/28（木）23:59',r:()=>secHw('oi'),st:()=>S.sent.oi?'sent':''},
 {g:'ひとりの課題',id:'me_jr',t:'JR九州の多角化の成功要因',d:'2/10（水）23:59',r:()=>secHw('jr'),st:()=>S.sent.jr?'sent':''},
 {g:'ひとりの課題',id:'me_refl',t:'振り返り',d:'2/18（木）23:59',r:()=>secHw('refl'),st:()=>S.sent.refl?'sent':''},
 {g:'チームの作業（チームリーダーが入力・全員が見る）',id:'t_team',t:'チームと依頼主',d:'第3回 12/18',r:secTeam,st:()=>S.mine?'done':''},
 {g:'チームの作業（チームリーダーが入力・全員が見る）',id:'t_interview',t:'担当者への聞き取り',d:'第3回 12/18',r:secInterview,st:()=>S.tsent.q?'sent':(S.T.interview.who?'done':'')},
 {g:'チームの作業（チームリーダーが入力・全員が見る）',id:'t_find',t:'見つける→つなぐ／AIだけの案',d:'第4・5回 12/25',r:secFind,st:()=>S.T.cell?'done':''},
 {g:'チームの作業（チームリーダーが入力・全員が見る）',id:'t_hyp',t:'仮説シート',d:'第5回→1/7（木）',r:secHyp,st:()=>S.tsent.hyp?'sent':(S.T.hyp.star&&S.T.hyp.stop?'done':'')},
 {g:'チームの作業（チームリーダーが入力・全員が見る）',id:'t_recs',t:'聞き取りの記録（集まったもの）',d:'年末年始→1/7（木）',r:secRecs,st:()=>S.recs.length?'done':''},

function bmdGeom(W,H,nw,nh,cw){const nodes=NODES();const P={};const n=nodes.length-1;nodes.forEach((nm,i)=>{if(i===0){P[nm]={x:W/2,y:H/2,w:cw,h:nh};return;}const a=-Math.PI/2+(i-1)*2*Math.PI/Math.max(n,1)+(n===2?Math.PI/2:0);P[nm]={x:W/2+Math.cos(a)*(W/2-nw/2-nh*0.1),y:H/2+Math.sin(a)*(H/2-nh/2-nh*0.1),w:nw,h:nh};});
 const clip=(c,dx,dy)=>{const sx=dx?(c.w/2)/Math.abs(dx):1e9,sy=dy?(c.h/2)/Math.abs(dy):1e9;const t=Math.min(sx,sy);return [c.x+dx*t,c.y+dy*t];};
 const E=S.T.bmd.flows.filter(f=>f.from&&f.to&&P[f.from]&&P[f.to]&&f.from!==f.to).map(f=>{const a=P[f.from],b=P[f.to];let dx=b.x-a.x,dy=b.y-a.y;const L=Math.hypot(dx,dy)||1;const ux=dx/L,uy=dy/L;const px=-uy,py=ux;const off=nh*0.18;
  const A0={x:a.x+px*off,y:a.y+py*off,w:a.w-2*Math.abs(px*off),h:a.h-2*Math.abs(py*off)},B0={x:b.x+px*off,y:b.y+py*off,w:b.w-2*Math.abs(px*off),h:b.h-2*Math.abs(py*off)};

 return {nodes,P,E};}
