<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>CE特論 2/5 判定の入力</title>
<script src="config.js"></script>
<style>
:root{--ac:#750145;--ac-d:#5d0037;--ac-l:#f4e8ef;--ink:#1f2328;--sub:#59636e;--line:#d8dde3;--soft:#f6f7f9}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI",sans-serif;font-size:18px;color:var(--ink);line-height:1.55}
button,textarea{font:inherit;color:inherit}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3em;margin:6px 0;color:var(--ac-d)}
.note{color:var(--sub);font-size:.85em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.tabs button.done::after{content:" ✓"}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.box.soft{background:var(--soft);border-color:transparent}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:8px 14px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ac);color:#fff;font-weight:700}
.big .seg button{padding:12px 16px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:4em}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:14px;font-weight:700;width:100%;cursor:pointer;margin-top:10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .3s}
.toast.on{opacity:.95}
</style>
</head>
<body>
<div class="w" id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const CFG=window.CE_CONFIG||{endpoint:''};
const JK=new URLSearchParams(location.search).get('k')||'';
const COND=['どの強みを使うかを、出所と一緒に指差せる','届ける相手と、いまの代わりの手段が分かっている','組む相手と、相手に増えるものが相手の言葉で書かれている','本人か同じ立場の人から「動いた」以上の反応がある','やめる条件と★があり、聞き取りでどうなったかが分かる','始めるための3つの問いに答え、最初の一歩が本業を止めず半年以内に試せる','社内で通す道（誰が決め、どの場で、何を借り、既存事業とどう関わるか）'];
const JD=['進める','条件つきで進める','見送る'];
const KEY='ce2026_hantei_'+JK;
let INFO=null,CUR='',S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
function keep(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(t){return S[t]=S[t]||{cond:[null,null,null,null,null,null,null],judge:'',why:'',text:'',sent:''};}
async function load(){if(!CFG.endpoint||!JK){$('app').innerHTML='<h1>判定の入力</h1><p>リンクが正しくありません。講師にお知らせください。</p>';return;}
 try{const r=await fetch(CFG.endpoint+'?'+new URLSearchParams({op:'judgeinfo',jkey:JK}));const j=await r.json();if(!j.ok)throw new Error(j.err);INFO=j;CUR=(j.teams[0]||j.others[0]||{}).team||'';render();}catch(e){$('app').innerHTML=`<h1>判定の入力</h1><p>${esc(e.message)}</p>`;}}
function render(){const own=INFO.teams.find(t=>t.team===CUR);const oth=INFO.others.find(t=>t.team===CUR);const s=st(CUR);
 $('app').innerHTML=`<h1>${esc(INFO.company)}のご担当者さま　判定の入力</h1><p class="note">各チームの発表（6分）と問い（9分）のあとに入力してください。押すとすぐ講師の画面に届きます。何度でも送り直せます（最後のものを使います）。</p>
 <div class="note" style="margin-top:8px">${esc(INFO.company)}を選んだチーム（判定）</div><div class="tabs">${INFO.teams.map(t=>`<button data-t="${t.team}" class="${t.team===CUR?'on':''} ${st(t.team).sent?'done':''}">チーム${t.team}</button>`).join('')}</div>
 <div class="note">他社を選んだチーム（ひと言）</div><div class="tabs">${INFO.others.map(t=>`<button data-t="${t.team}" class="${t.team===CUR?'on':''} ${st(t.team).sent?'done':''}">チーム${t.team}</button>`).join('')}</div>
 ${own?ownForm(own,s):oth?othForm(oth,s):''}`;}
function ownForm(t,s){return `<div class="box soft"><b>チーム${t.team}　${esc(t.title)}</b><div>${esc(t.one)}</div>${t.ask?`<div class="note" style="margin-top:6px">お願い：${esc(t.ask)}</div>`:''}${t.first?`<div class="note">最初の一歩：${esc(t.first)}</div>`:''}</div>
 <div class="box"><b>7つの条件</b><p class="note">そろっていれば○、足りなければ×（迷えば空欄のまま）</p>${COND.map((c,i)=>`<div class="row"><div>${i+1}. ${c}</div><div class="seg">${['○','×'].map(v=>`<button data-c="${i}" data-v="${v}" class="${s.cond[i]===v?'on':''}">${v}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="box big"><b>社内の会議なら</b><div style="margin-top:8px" class="seg">${JD.map(v=>`<button data-j="${v}" class="${s.judge===v?'on':''}">${v}</button>`).join('')}</div>
 <p class="note" style="margin:10px 0 4px">理由・条件（ひと言で）</p><textarea data-f="why">${esc(s.why)}</textarea></div>
 <button class="btn" data-send="judge">チーム${t.team}の判定を送る</button>${s.sent?`<p class="note">送信済み ${esc(s.sent)}</p>`:''}`;}
function othForm(t,s){return `<div class="box soft"><b>チーム${t.team}　${esc(t.title)}</b></div><div class="box"><b>他社の新規事業担当として、ひと言</b><textarea data-f="text">${esc(s.text)}</textarea></div><button class="btn" data-send="comment">ひと言を送る</button>${s.sent?`<p class="note">送信済み ${esc(s.sent)}</p>`:''}`;}
async function send(kind){const s=st(CUR);const data=kind==='judge'?{kind,cond:s.cond,judge:s.judge,why:s.why}:{kind,text:s.text};if(kind==='judge'&&!s.judge){toast('「進める／条件つきで進める／見送る」を選んでください');return;}if(kind==='comment'&&!s.text.trim()){toast('ひと言を入れてください');return;}
 try{const r=await fetch(CFG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({op:'judge',jkey:JK,team:CUR,data})});const j=await r.json();if(!j.ok)throw new Error(j.err);const d=new Date();s.sent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;keep();render();toast('送りました');}catch(e){toast(e.message);}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;const s=st(CUR);
 if(d.t){CUR=d.t;render();}else if(d.c!=null){s.cond[+d.c]=s.cond[+d.c]===d.v?null:d.v;keep();render();}else if(d.j){s.judge=d.j;keep();render();}else if(d.send)send(d.send);});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f){st(CUR)[t.dataset.f]=t.value;keep();}});
load();
</script>
</body>
</html>
